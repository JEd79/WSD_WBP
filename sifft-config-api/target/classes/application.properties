spring.application.name=sifft-config-api

# In-memory H2 database (resets on restart) - ideal for the PoC and demo screenshots
spring.datasource.url=jdbc:h2:mem:siftconfig;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# H2 web console at http://localhost:8080/h2-console (JDBC URL: jdbc:h2:mem:siftconfig)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
